version: 2

registries:
  maven-google:
    type: maven-repository
    url: "https://dl.google.com/dl/android/maven2/"

  maven-central:
    type: maven-repository
    url: "https://repo.maven.apache.org/maven2"

  jitpack:
    type: maven-repository
    url: "https://www.jitpack.io"

updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      ruby-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-central
      - maven-google
      - jitpack
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    ignore:
      - dependency-name: "org.fossify:commons"
      - dependency-name: "io.nlopez.compose.rules:detekt"
        versions: [">= 0.5.0"]
      # Requires compileSdk 37 (project is on compileSdk 36)
      - dependency-name: "com.github.bumptech.glide:*"
        versions: [">= 5.0.8"]
    groups:
      # Security-sensitive libraries (Tink, BouncyCastle, Biometric) are excluded from
      # groups below so each arrives in its own separate PR for careful review.
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.biometric:*"
        update-types: ["minor", "patch"]
      kotlin-ksp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
        update-types: ["minor", "patch"]
      other-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "com.google.crypto.tink:*"
          - "org.bouncycastle:*"
          - "androidx.biometric:*"
        update-types: ["minor", "patch"]

  # Native Argon2 (Rust) dependencies: argon2, jni, zeroize
  - package-ecosystem: "cargo"
    directory: "/rust/calypso-argon2"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Pure-Rust isolated media decoders: gif, png, image-webp, jxl-oxide, jni-sys
  - package-ecosystem: "cargo"
    directory: "/rust/calypso-media"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Desktop companion CLI (Python): cryptography, argon2-cffi, tink
  - package-ecosystem: "pip"
    directory: "/tools/calypso-cli"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
