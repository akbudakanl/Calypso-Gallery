name: Update Detekt Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baseline:
    name: Regenerate app/detekt-baseline.xml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: FossifyOrg/.github/.github/actions/gradle-cache@a5aa5c5191edab24a7a011dfa20c945b06e475fe

      - name: Generate detekt baseline
        run: ./gradlew detektBaseline

      - name: Commit updated baseline
        run: |
          if git diff --quiet -- app/detekt-baseline.xml; then
            echo "No changes to app/detekt-baseline.xml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/detekt-baseline.xml
          git commit -m "chore(ci): regenerate detekt baseline"
          git push
