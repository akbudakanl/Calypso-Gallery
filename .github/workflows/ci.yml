name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-tooling:
    name: Fork tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s .github/scripts/tests -v

  rust:
    name: Rust (Argon2 & Media) tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cargo test
        run: |
          cargo test --manifest-path rust/calypso-argon2/Cargo.toml --locked
          cargo test --manifest-path rust/calypso-media/Cargo.toml --locked

  android:
    name: Android (detekt, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"
      - uses: FossifyOrg/.github/.github/actions/gradle-cache@a5aa5c5191edab24a7a011dfa20c945b06e475fe

      - name: Set up Rust & Android NDK for native Argon2
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          ndk_dir=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)
          if [[ -z "$ndk_dir" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            ndk_dir="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - name: Detekt
        run: ./gradlew detekt

      - name: Unit tests (FOSS debug)
        run: ./gradlew testFossDebugUnitTest

      - name: Check signing secrets availability
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$KEYSTORE_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing secrets
        if: steps.signing.outputs.available == 'true'
        uses: FossifyOrg/.github/.github/actions/decode-secrets@a5aa5c5191edab24a7a011dfa20c945b06e475fe
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Assemble FOSS release
        run: ./gradlew assembleFossRelease

      - name: Upload FOSS release APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calypso-foss-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up secrets
        if: always() && steps.signing.outputs.available == 'true'
        uses: FossifyOrg/.github/.github/actions/cleanup-secrets@a5aa5c5191edab24a7a011dfa20c945b06e475fe
