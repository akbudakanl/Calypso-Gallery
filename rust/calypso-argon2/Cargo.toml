[package]
name = "calypso-argon2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "calypso_argon2"
crate-type = ["cdylib"]

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
jni = { version = "0.22.4", default-features = false }
zeroize = "1.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
