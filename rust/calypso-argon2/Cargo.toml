[package]
name = "calypso-argon2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "calypso_argon2"
crate-type = ["cdylib"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.2.17"
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
jni-sys = "0.4.1"
sha2 = { version = "0.11.2", default-features = false }
zeroize = { version = "1.8.1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
